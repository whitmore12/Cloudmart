<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Listing</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f3f0e7;
      color: #1d233e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .create-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      width: 350px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .create-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .create-container input,
    .create-container select {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: none;
      background: #ece7d6;
      color: #1d233e;
      box-sizing: border-box;
    }

    /* grey text until a real choice is picked */
    .create-container select:required:invalid { color: #8a8576; }
    .create-container option { color: #1d233e; }

    .btn-primary {
      width: 100%;
      padding: 10px;
      background: #e25d3b;
      border: none;
      color: #fff;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    .btn-primary:hover {
      background: #c8502f;
    }

    .top-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .top-links a {
      text-decoration: none;
      font-size: 14px;
    }

    .back-link {
      color: #e25d3b;
    }

    .signout-link {
      color: #ff6b6b;
    }
  </style>
  <link rel="icon" type="image/svg+xml" href="/Resources/eCampFavicon.svg">
</head>

<body>
  <div class="create-container">
    <div class="top-links">
      <a href="./index.html" class="back-link">← Back to Home</a>
      <a href="#" class="signout-link" onclick="signOut()">Sign Out</a>
    </div>

    <h2 id="pageTitle">Create Listing</h2>

    <input id="title" placeholder="Title" />
    <input id="price" placeholder="Price" type="number" step="0.01" />

    <select id="category" required onchange="updateSizeFields()">
      <option value="" disabled selected>Category</option>
      <option>Clothing</option>
      <option>Shoes</option>
      <option>Bags &amp; Accessories</option>
      <option>Electronics</option>
      <option>Books</option>
      <option>Furniture</option>
      <option>Appliances</option>
      <option>Dorm &amp; Home</option>
      <option>Beauty</option>
      <option>Other</option>
    </select>

    <!-- Edited by Makaila Williams 11/12/26 -->
    <!-- Purpose: fit and size dropdowns, only shown for clothing and shoes -->
    <div id="sizeFields" style="display: none;">
      <select id="fit" required>
        <option value="" disabled selected>Fit</option>
        <option>Women's</option>
        <option>Men's</option>
        <option>Unisex</option>
      </select>

      <select id="size" required>
        <option value="" disabled selected>Size</option>
      </select>
    </div>

    <select id="condition" required>
      <option value="" disabled selected>Condition</option>
      <option>New</option>
      <option>Used</option>
    </select>

    <input id="image" type="file" accept="image/*" required />

    <button class="btn-primary" id="submitBtn" onclick="submitListing()">Create</button>
  </div>

  <script>
    const API = window.location.origin;

    const params = new URLSearchParams(window.location.search);
    const editId = params.get("edit");
    const isEditMode = !!editId;

    const pageTitle = document.getElementById("pageTitle");
    const submitBtn = document.getElementById("submitBtn");

    if (isEditMode) {
      pageTitle.innerText = "Edit Listing";
      submitBtn.innerText = "Update";
      loadListingForEdit();
    }

    // Edited by Makaila Williams 11/12/26
    // Purpose: the size choices for clothing and shoes
    const CLOTHING_SIZES = ["XS", "S", "M", "L", "XL", "XXL"];
    const SHOE_SIZES = Array.from({ length: 15 }, (_, i) => "US " + (i + 1));

    // shows fit and size for clothing and shoes, hides them for everything else
    function updateSizeFields() {
      const category = document.getElementById("category").value;
      const box = document.getElementById("sizeFields");
      const fitSelect = document.getElementById("fit");
      const sizeSelect = document.getElementById("size");

      let sizes = [];
      if (category === "Clothing") sizes = CLOTHING_SIZES;
      if (category === "Shoes") sizes = SHOE_SIZES;

      if (sizes.length === 0) {
        box.style.display = "none";
        fitSelect.value = "";
        sizeSelect.innerHTML = '<option value="" disabled selected>Size</option>';
        return;
      }

      // rebuild the size list and keep the picked size if it is still there
      const previous = sizeSelect.value;
      sizeSelect.innerHTML = '<option value="" disabled selected>Size</option>' +
        sizes.map(sz => `<option>${sz}</option>`).join("");
      if (sizes.includes(previous)) sizeSelect.value = previous;
      box.style.display = "block";
    }

    function signOut() {
      localStorage.removeItem("user");
      localStorage.removeItem("isLoggedIn");
      localStorage.removeItem("currentUser");
      localStorage.removeItem("userId");
      window.location.href = "signin.html";
    }

    async function uploadImageToS3(file) {
      const formData = new FormData();
      formData.append("file", file);

      const uploadRes = await fetch(`${API}/api/uploads/listing`, {
        method: "POST",
        body: formData
      });
      const data = await uploadRes.json();
      if (!uploadRes.ok) {
        throw new Error(data.error || "Failed to upload listing image.");
      }

      return data.imageUrl;
    }

    async function loadListingForEdit() {
      try {
        const res = await fetch(`${API}/api/listings/${editId}`);
        const listing = await res.json();

        if (!res.ok) throw new Error(listing.error || "Failed to load listing");

        document.getElementById("title").value = listing.title || "";
        document.getElementById("price").value = listing.price ?? "";
        document.getElementById("category").value = listing.category || "";
        document.getElementById("condition").value = listing.condition || "";

        // show the boxes first so the saved fit and size can be filled in
        updateSizeFields();
        if (listing.fit) document.getElementById("fit").value = listing.fit;
        if (listing.size) document.getElementById("size").value = listing.size;

        window.currentImage = listing.image || "https://picsum.photos/300";
      } catch (err) {
        console.error("Error loading listing:", err);
        alert("Error loading listing: " + err.message);
      }
    }

    async function submitListing() {
      const user = JSON.parse(localStorage.getItem("user") || "null");

      if (!user || !user.id) {
        alert("You must be logged in to continue.");
        return;
      }

      const title = document.getElementById("title").value.trim();
      const price = parseFloat(document.getElementById("price").value);
      const category = document.getElementById("category").value;
      const condition = document.getElementById("condition").value;
      const imageFile = document.getElementById("image").files[0];

      if (!title || isNaN(price)) {
        alert("Please enter a valid title and price.");
        return;
      }

      if (!category || !condition) {
        alert("Please pick a category and a condition.");
        return;
      }

      const needsSize = category === "Clothing" || category === "Shoes";
      const fit = needsSize ? document.getElementById("fit").value : null;
      const size = needsSize ? document.getElementById("size").value : null;

      if (needsSize && (!fit || !size)) {
        alert("Please pick a fit and a size.");
        return;
      }

if (!isEditMode && !imageFile) {
        alert("Please upload a picture to post a listing.");
        return;
      }

      let imageUrl = window.currentImage || "";
      try {
        if (imageFile) {
          imageUrl = await uploadImageToS3(imageFile);
        }

        const listing = {
          user_id: Number(user.id),
          title: title,
          price: price,
          category: category,
          condition: condition,
          fit: fit,
          size: size,
          image: imageUrl
        };

        let res;
        const endpoint = isEditMode ? `${API}/api/listings/${editId}` : `${API}/api/listings`;
        const method = isEditMode ? "PUT" : "POST";

        res = await fetch(endpoint, {
          method: method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(listing)
        });

        if (res.ok) {
          alert(isEditMode ? "Listing updated successfully!" : "Listing created successfully!");
          window.location.href = "index.html";
        } else {
          const errText = await res.text();
          throw new Error(errText);
        }
      } catch (err) {
        alert("Error: " + err.message);
      }
    }
  </script>
</body>
</html>
