<!-- Tyson Satterwhite -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>eCamp Marketplace</title>
<link rel="stylesheet" href="styles.css" />
<style>
* { box-sizing: border-box; margin:0; padding:0; }
body { font-family: system-ui, Arial, sans-serif; background: #f3f0e7; color: #1d233e; line-height:1.5; }

.site-header {
  background: #ffffff;
  padding: 12px 20px;
  border-bottom: 1px solid rgba(29,35,62,0.12);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: bold;
  font-size: 1.2rem;
  color: #1d233e;
  text-decoration: none;
}

.logo { height: 40px; }

.nav-menu {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.2s;
}
.btn:hover { opacity: 0.85; }

.btn-primary { background: #e25d3b; border: none; color: white; }
.btn-secondary { background: #ef4444; border: none; color: white; }
.btn-outline { border: 1px solid #e25d3b; background: transparent; color: #e25d3b; }
.full { width: 100%; }

.user-btn {
  background: transparent;
  border: none;
  color: #1d233e;
  cursor: pointer;
  font: inherit;
  padding: 0 4px;
}
.user-btn:hover {
  color: #e25d3b;
}

/* Edited by Makaila Williams 11/12/26 */
/* Purpose: move the filters to the top so the listings do not get squished in a small window */
.fb-layout { display: block; min-height: calc(100vh - 70px); }

.fb-sidebar {
  padding: 20px;
  background: #ffffff;
  border-bottom: 1px solid rgba(29,35,62,0.12);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* the pills are really checkboxes, the css just makes them look like buttons */
.pill-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.pill { cursor: pointer; flex: 0 0 auto; }
.pill input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
}
.pill span {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid rgba(29,35,62,0.25);
  background: #ffffff;
  font-size: 0.9rem;
  white-space: nowrap;
  transition: 0.15s;
}
.pill:hover span { border-color: #e25d3b; }
.pill input:checked + span {
  background: #e25d3b;
  border-color: #e25d3b;
  color: #ffffff;
}
.pill input:focus-visible + span { outline: 2px solid #1d233e; outline-offset: 2px; }

.fb-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.fb-controls-right { display: flex; gap: 8px; align-items: center; }

.sort-select {
  padding: 7px 12px;
  border-radius: 999px;
  border: 1px solid rgba(29,35,62,0.25);
  background: #ffffff;
  color: #1d233e;
  font: inherit;
  font-size: 0.9rem;
  cursor: pointer;
}

.fb-search {
  width: 100%;
  padding: 10px 15px;
  border-radius: 999px;
  border: none;
  background: #ece7d6;
  color: #1d233e;
  outline: none;
}

.fb-section h4 { margin-bottom: 10px; font-weight: bold; }
.fb-content { padding: 20px; }
.fb-topbar { display: flex; align-items: baseline; gap: 12px; margin-bottom: 15px; }
.fb-topbar h2 { font-size: 1.5rem; }

.fb-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; }

.feature-card {
  background: #ffffff;
  border-radius: 12px;
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
  display: flex;
  flex-direction: column;
}

.feature-card:hover {
  transform: scale(1.02);
  box-shadow: 0 4px 12px rgba(29,35,62,0.18);
}

.product-img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  background: #ece7d6;
}

.card-body {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.price { font-weight: bold; font-size: 1.1rem; }
.condition { font-size: 0.85rem; color: #706b5f; }

.card-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.heart-btn {
  background: none;
  border: none;
  font-size: 1.4rem;
  cursor: pointer;
  transition: transform 0.2s;
  padding: 0;
}
.heart-btn:hover { transform: scale(1.2); }
.heart-btn.saved { color: #ef4444; }

.seller-btn {
  background: transparent;
  color: #e25d3b;
  border: none;
  cursor: pointer;
  padding: 0;
  font: inherit;
  text-decoration: underline;
}
.seller-btn:hover {
  color: #c8502f;
}

.muted {
  color: #706b5f;
  font-size: 0.92rem;
}

@media (max-width: 1200px) {
  .fb-grid { grid-template-columns: repeat(3,1fr); }
}

@media (max-width: 900px) {
  .fb-grid { grid-template-columns: repeat(2,1fr); }
  /* on small screens the pills turn into one row you scroll sideways */
  #categoryPills { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; }
}

@media (max-width: 600px) {
  .fb-grid { grid-template-columns: 1fr; }
  .nav-menu { flex-direction: column; align-items: flex-end; gap: 5px; }
}
</style>
  <link rel="icon" type="image/svg+xml" href="/Resources/eCampFavicon.svg">
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html">
    <img src="/Resources/eCampLogo.svg" class="logo" alt="eCamp logo" />
    <span>eCamp</span>
  </a>

  <div class="nav-menu">
  <button id="createListingBtn" class="btn btn-primary" style="display: none;" onclick="goToCreatePage()">+ Sell Item</button>
  <button id="wishlistBtn" class="btn btn-outline" style="display: none;" onclick="goToWishlist()">❤️ Wishlist</button>
  <button id="cartBtn" class="btn btn-secondary" style="display: none;" onclick="goToCartPage()">🛒 Cart (<span id="cartCount">0</span>)</button>
  <button id="walletBtn" class="btn btn-secondary" style="display: none;" onclick="goToWallet()">💰 Wallet (<span id="walletBalance">$0.00</span>)</button>
 
  <button id="adminBtn" class="btn btn-outline" onclick="goToAdmin()">📊 Admin</button>
  <button id="userDisplay" class="btn btn-outline" onclick="goToMyListings()"></button>
  <button class="btn btn-outline" onclick="logout()">Sign Out</button>
</div>
</header>

<main class="fb-layout">
  <!-- Edited by Makaila Williams 11/12/26 -->
  <!-- Purpose: category and condition pills and the sort dropdown -->
  <aside class="fb-sidebar">
    <h2>Marketplace</h2>

    <input
      type="text"
      placeholder="Search Marketplace"
      class="fb-search"
      id="searchInput"
      onkeyup="applyFilters()"
    />

    <div class="fb-section">
      <h4>Categories</h4>
      <!-- clicking a pill filters right away -->
      <div class="pill-row" id="categoryPills" onchange="applyFilters()">
        <label class="pill"><input type="checkbox" name="category" value="Clothing"><span>Clothing</span></label>
        <label class="pill"><input type="checkbox" name="category" value="Shoes"><span>Shoes</span></label>
        <label class="pill"><input type="checkbox" name="category" value="Bags &amp; Accessories"><span>Bags &amp; Accessories</span></label>
        <label class="pill"><input type="checkbox" name="category" value="Electronics"><span>Electronics</span></label>
        <label class="pill"><input type="checkbox" name="category" value="Books"><span>Books</span></label>
        <label class="pill"><input type="checkbox" name="category" value="Furniture"><span>Furniture</span></label>
        <label class="pill"><input type="checkbox" name="category" value="Appliances"><span>Appliances</span></label>
        <label class="pill"><input type="checkbox" name="category" value="Dorm &amp; Home"><span>Dorm &amp; Home</span></label>
        <label class="pill"><input type="checkbox" name="category" value="Beauty"><span>Beauty</span></label>
        <label class="pill"><input type="checkbox" name="category" value="Other"><span>Other</span></label>
      </div>
    </div>

    <div class="fb-controls">
      <div class="pill-row" onchange="applyFilters()">
        <label class="pill"><input type="checkbox" name="condition" value="New"><span>New</span></label>
        <label class="pill"><input type="checkbox" name="condition" value="Used"><span>Used</span></label>
      </div>

      <div class="fb-controls-right">
        <select id="sortSelect" class="sort-select" onchange="applyFilters()">
          <option value="newest">Sort: Newest</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
        </select>
        <button class="btn btn-outline" onclick="clearFilters()">Clear</button>
      </div>
    </div>
  </aside>

  <section class="fb-content">
    <div class="fb-topbar"><h2>Today's Picks</h2><span id="resultCount" class="muted"></span></div>
    <div id="listings" class="fb-grid"></div>
  </section>
</main>

<!-- Message seller popup -->
<div id="msgOverlay" class="msg-overlay">
  <div class="msg-box">
    <h3 id="msgItemTitle">Message seller</h3>
    <p id="msgSellerName" class="muted"></p>
    <textarea id="msgBody" maxlength="2000" placeholder="Write your message..."></textarea>
    <div class="msg-actions">
      <button class="btn btn-primary" id="msgSendBtn" onclick="sendMessageToSeller()">Send</button>
      <button class="btn btn-outline" onclick="closeMessageBox()">Cancel</button>
    </div>
  </div>
</div>

<script>
const API = window.location.origin;

let allListings = [];
let wishlistItems = [];

// Edited by Makaila Williams 11/12/26
// Purpose: show a placeholder picture when a listing has no photo
const NO_PHOTO = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="180">' +
  '<rect width="100%" height="100%" fill="#ece7d6"/>' +
  '<text x="50%" y="50%" fill="#706b5f" font-family="Arial" font-size="16" ' +
  'text-anchor="middle" dominant-baseline="middle">No photo yet</text></svg>'
);
let cart = JSON.parse(localStorage.getItem("cart")) || [];
const user = JSON.parse(localStorage.getItem("user") || "null");

if (user) {
  const el = document.getElementById("userDisplay");
  if (el) el.innerText = "Hi, " + (user.username || "User");
  document.getElementById("createListingBtn").style.display = "inline-flex";
  document.getElementById("wishlistBtn").style.display = "inline-flex";
  document.getElementById("cartBtn").style.display = "inline-flex";
  document.getElementById("walletBtn").style.display = "inline-flex";
  loadWalletBalance();
} else {
  window.location.href = "Signin.html";
}

async function loadWalletBalance() {
  try {
    const res = await fetch(`${API}/api/wallet/balance?user_id=${user.id}`);
    const data = await res.json();
    if (res.ok) {
      document.getElementById("walletBalance").textContent = "$" + Number(data.balance).toFixed(2);
    }
  } catch (e) { console.error(e); }
}

// Hide admin button if user is not admin
if (!user || user.role !== "admin") {
  const adminBtn = document.getElementById("adminBtn");
  if (adminBtn) adminBtn.style.display = "none";
}

function logout() {
  localStorage.clear();
  window.location.href = "Signin.html";
}

updateCartCount();

function updateCartCount() {
  cart = JSON.parse(localStorage.getItem("cart")) || [];
  const cartEl = document.getElementById("cartCount");
  if (cartEl) cartEl.innerText = cart.length;
}

function goToCreatePage() { window.location.href = "create.html"; }
function goToCartPage() { window.location.href = "cart.html"; }
function goToWishlist() { window.location.href = "wishlist.html"; }
function goToWallet() { window.location.href = "wallet.html"; }
function goToAdmin() { window.location.href = "admin.html"; }

function goToSellerListings(sellerName) {
  window.location.href = `profile.html?seller=${encodeURIComponent(sellerName)}`;
}

function goToMyListings() {
  if (!user || !user.username) return;
  window.location.href = `profile.html?seller=${encodeURIComponent(user.username)}`;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

async function loadListings() {
  try {
    const res = await fetch(`${API}/api/listings`);
    const data = await res.json();

    allListings = Array.isArray(data) ? data : [];

    applyFilters();
  } catch (err) {
    console.error("Error loading listings:", err);
    document.getElementById("listings").innerHTML = "<p class='muted'>Unable to load listings right now.</p>";
  }
}

async function loadWishlist() {
  if (!user || user.id == null) return;
  try {
    const res = await fetch(`${API}/api/wishlist?user_id=${user.id}`);
    const data = await res.json();
    wishlistItems = Array.isArray(data) ? data : [];
  } catch (err) {
    console.error("Wishlist error:", err);
    wishlistItems = [];
  }
}

function renderListings(data) {
  const container = document.getElementById("listings");
  container.innerHTML = "";

  const countEl = document.getElementById("resultCount");
  if (countEl) countEl.innerText = (data ? data.length : 0) + (data && data.length === 1 ? " item" : " items");

  if (!data || data.length === 0) {
    container.innerHTML = "<p class='muted'>Nothing here yet. Try clearing a filter or two.</p>";
    return;
  }

  data.forEach(item => {
    const isAdmin = user && user.role === "admin";
    const isOwner = user && user.id != null && Number(item.user_id) === Number(user.id);
    const hasPermission = isAdmin || isOwner;

    const isSaved = wishlistItems.some(w => Number(w.id) === Number(item.id));

    const safeTitle = escapeHtml(item.title);
    const safeCategory = escapeHtml(item.category);
    const safeCondition = escapeHtml(item.condition);
    const safeSeller = escapeHtml(item.seller || "");
    const safeImage = escapeHtml(item.image);
    const displayPrice = Number(item.price) || 0;

    // clothing and shoes also show their fit and size on the card
    const sizeLine = item.size
      ? `<p class="condition">${item.fit ? escapeHtml(item.fit) + " • " : ""}${escapeHtml(item.size)}</p>`
      : "";

    const sellerMarkup = safeSeller
      ? `<button class="seller-btn" onclick="goToSellerListings('${safeSeller}')">${safeSeller}</button>`
      : `<span>Unknown</span>`;

    container.innerHTML += `
  <article class="feature-card">
    <img src="${safeImage}" class="product-img" alt="${safeTitle}" onerror="this.onerror=null;this.src=NO_PHOTO">
    <div class="card-body">
      <div class="card-header-row">
        <p class="price">$${displayPrice.toFixed(2)}</p>
        </div>

      <h3>${safeTitle}</h3>
      <p class="condition">${safeCategory} • ${safeCondition}</p>
      ${sizeLine}
      <p class="muted">Seller: ${sellerMarkup}</p>

      ${
        !isOwner ? `
          <button onclick="openMessageBox(${Number(item.id)})" class="btn btn-primary full" style="margin-top: 5px;">💬 Message seller</button>
        ` : ""
      }

      <button class="heart-btn ${isSaved ? 'saved' : ''}" onclick="toggleWishlist(${item.id}, ${isSaved})">${isSaved ? '❤️' : '🤍'}</button>

      ${
        !isOwner && item.status === "active"
          ? `<button onclick="addToCart(${item.id})" class="btn btn-primary full">Add to Cart</button>`
          : ""
      }

      ${
        hasPermission ? `
          <div style="display: flex; gap: 5px; margin-top: 5px;">
            <button onclick="editListing(${Number(item.id)})" class="btn btn-outline full" style="flex:1;">Edit</button>
            <button onclick="deleteListing(${Number(item.id)})" class="btn btn-secondary full" style="flex:1;">Delete</button>
          </div>
        ` : ""
      }
    </div>
  </article>
`;
  });
}

function addToCart(id) {
  const item = allListings.find(i => Number(i.id) === Number(id));

  if (!item) return;

  if (item.status !== "active") {
    return alert("This item has already been sold.");
  }

  if (cart.some(cartItem => Number(cartItem.id) === Number(item.id))) {
    return alert("This item is already in your cart.");
  }

  cart.push(item);
  localStorage.setItem("cart", JSON.stringify(cart));
  updateCartCount();
  alert("Added to cart!");
}

// Edited by Makaila Williams 11/12/26
// Purpose: filter by category and condition, then sort
async function initiatePurchase(listingId) {
  if (!user || !user.id) {
    alert("Please sign in first.");
    return;
  }

  if (!confirm("Initiate purchase for this listing? You will receive a PIN to share with the seller.")) return;

  try {
    const res = await fetch(`${API}/api/listings/${listingId}/initiate-purchase`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        user_id: user.id,
        role: user.role
      })
    });

    const data = await res.json();

    if (!res.ok) {
      alert(data.error || "Failed to initiate purchase.");
      return;
    }

    alert("Purchase initiated!\nYour verification PIN: " + data.verification_pin + "\nShare this PIN with the seller to complete the purchase.");
    await loadListings();
  } catch (err) {
    console.error(err);
    alert("Error connecting to server.");
  }
}
function applyFilters() {
  const searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();
  const selectedCategories = Array.from(
    document.querySelectorAll("input[name=category]:checked")
  ).map(cb => cb.value);
  const selectedConditions = Array.from(
    document.querySelectorAll("input[name=condition]:checked")
  ).map(cb => cb.value);
  const sortBy = document.getElementById("sortSelect").value;

  let filtered = [...allListings];

  if (searchQuery) {
    filtered = filtered.filter(item =>
      (item.title || "").toLowerCase().includes(searchQuery) ||
      (item.category || "").toLowerCase().includes(searchQuery) ||
      (item.seller || "").toLowerCase().includes(searchQuery)
    );
  }

  if (selectedCategories.length > 0) {
    filtered = filtered.filter(item =>
      selectedCategories.includes(item.category)
    );
  }

  if (selectedConditions.length > 0) {
    filtered = filtered.filter(item =>
      selectedConditions.includes(item.condition)
    );
  }

  // sorting filtered will not change allListings because it is a copy
  if (sortBy === "low") {
    filtered.sort((a, b) => Number(a.price) - Number(b.price));
  } else if (sortBy === "high") {
    filtered.sort((a, b) => Number(b.price) - Number(a.price));
  } else {
    filtered.sort((a, b) => Number(b.id) - Number(a.id));
  }

  renderListings(filtered);
}

function clearFilters() {
  document.getElementById("searchInput").value = "";
  document.querySelectorAll("input[name=category], input[name=condition]").forEach(cb => cb.checked = false);
  document.getElementById("sortSelect").value = "newest";
  applyFilters();
}

function editListing(listingId) {
  window.location.href = `create.html?edit=${listingId}`;
}

async function deleteListing(listingId) {
  if (!confirm("Are you sure you want to delete this listing?")) return;

  try {
    const res = await fetch(`${API}/api/listings/${listingId}`, {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        user_id: user.id,
        role: user.role
      })
    });

    if (res.ok) {
      alert("Listing deleted.");
      await loadListings();
    } else {
      const data = await res.json();
      alert(data.error || "Failed to delete listing.");
    }
  } catch (err) {
    console.error("Delete error:", err);
    alert("Error connecting to server.");
  }
}

async function toggleWishlist(listingId, isSaved) {
  if (!user) return alert("Please log in first.");
  try {
    const method = isSaved ? "DELETE" : "POST";
    const url = isSaved ? `${API}/api/wishlist/${listingId}?user_id=${user.id}` : `${API}/api/wishlist`;
    const body = isSaved ? null : JSON.stringify({ user_id: user.id, listing_id: listingId });

    const res = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json" },
      body
    });

    if (res.ok) {
      await loadWishlist();
      applyFilters();
    } else {
      const data = await res.json();
      alert(data.error || "Could not update wishlist.");
    }
  } catch (err) {
    console.error("Wishlist error:", err);
    alert("Error connecting to server.");
  }
}



async function init() {
  await loadWishlist();
  await loadListings();
}



init();
</script>
</body>
</html>
