<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - eCamp</title>
  <link rel="icon" href="/Resources/eCampFavicon.svg">
  <style>
    :root {
      --orange: #e8650a; --orange-dark: #c2540a; --orange-tint: #fff4ec;
      --ink: #1f2328; --muted: #5f6670; --line: #d9dde3;
      --bg: #ffffff; --card: #ffffff;
      --ok-bg: #e8f5ec; --ok: #1e6b37; --err-bg: #fdecee; --err: #a1241b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 400px; background: var(--card);
      border: 1px solid var(--line); border-radius: 12px; padding: 32px 28px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .06); border-top: 4px solid var(--orange);
    }
    .logo { display: block; height: 40px; margin: 0 auto 20px; }
    h1 { font-size: 1.4rem; margin: 0 0 6px; text-align: center; }
    .sub { color: var(--muted); text-align: center; margin: 0 0 24px; font-size: .95rem; line-height: 1.45; }
    label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
    input {
      width: 100%; padding: 11px 12px; margin-bottom: 16px; font-size: 1rem;
      border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink);
    }
    input:focus { outline: 2px solid var(--orange); outline-offset: 1px; border-color: transparent; }
    .pw { position: relative; }
    .pw input { padding-right: 60px; }
    .toggle {
      position: absolute; right: 8px; top: 7px; padding: 4px 6px; border: 0; background: none;
      color: var(--muted); font-size: .85rem; cursor: pointer;
    }
    .btn {
      width: 100%; padding: 12px; border: 0; border-radius: 8px; cursor: pointer;
      background: var(--orange); color: #fff; font-size: 1rem; font-weight: 600;
    }
    .btn:hover { background: var(--orange-dark); }
    .btn:disabled { opacity: .6; cursor: default; }
    .msg { display: none; padding: 10px 12px; border-radius: 8px; font-size: .92rem; line-height: 1.45; margin-bottom: 16px; }
    .msg.ok { display: block; background: var(--ok-bg); color: var(--ok); }
    .msg.err { display: block; background: var(--err-bg); color: var(--err); }
    .msg a { color: inherit; font-weight: 600; }
    .links { margin-top: 20px; display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; font-size: .9rem; }
    .links a { color: var(--orange-dark); text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    .hidden { display: none; }
    .done { text-align: center; }
    .check {
      width: 52px; height: 52px; margin: 0 auto 16px; border-radius: 50%;
      background: var(--ok-bg); color: var(--ok); display: grid; place-items: center; font-size: 1.6rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/Resources/eCampLogo.svg" alt="eCamp" onerror="this.style.display='none'">

    //ask for email
    <section id="requestView">
      <h1>Forgot your password?</h1>
      <p class="sub">Enter your account email and we'll send you a link to reset it.</p>
      <div id="requestMsg" class="msg" role="status"></div>
      <form id="requestForm" novalidate>
        <label for="resetEmail">Email</label>
        <input type="email" id="resetEmail" placeholder="user@my.hamptonu.edu" autocomplete="email" required>
        <button class="btn" id="sendBtn" type="submit">Send reset link</button>
      </form>
    </section>

    //setting new password
    <section id="newPassView" class="hidden">
      <h1>Set a new password</h1>
      <p class="sub">Use at least 8 characters.</p>
      <div id="newPassMsg" class="msg" role="status"></div>
      <form id="newPassForm" novalidate>
        <label for="newPassword">New password</label>
        <div class="pw">
          <input type="password" id="newPassword" autocomplete="new-password" required>
          <button type="button" class="toggle" data-for="newPassword">Show</button>
        </div>
        <label for="confirmPassword">Confirm new password</label>
        <div class="pw">
          <input type="password" id="confirmPassword" autocomplete="new-password" required>
          <button type="button" class="toggle" data-for="confirmPassword">Show</button>
        </div>
        <button class="btn" id="resetBtn" type="submit">Reset password</button>
      </form>
    </section>

    
    <section id="doneView" class="hidden done">
      <div class="check" aria-hidden="true">✓</div>
      <h1>Password updated</h1>
      <p class="sub">You can now sign in with your new password.</p>
      <a class="btn" href="Signin.html" style="display:block;text-decoration:none;">Go to sign in</a>
    </section>

    <nav class="links">
      <a href="Signin.html">Back to sign in</a>
      <a href="forgot-username.html">Forgot username?</a>
    </nav>
  </main>

  <script>
    const API_BASE = window.location.origin;
    const token = new URLSearchParams(window.location.search).get("token");

    const show = (id) => {
      ["requestView", "newPassView", "doneView"].forEach(v =>
        document.getElementById(v).classList.toggle("hidden", v !== id));
    };
    const setMsg = (el, type, html) => { el.className = "msg " + type; el.innerHTML = html; };

    if (token) show("newPassView");

    
    document.querySelectorAll(".toggle").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.for);
        const hidden = input.type === "password";
        input.type = hidden ? "text" : "password";
        btn.textContent = hidden ? "Hide" : "Show";
      });
    });

    //getting link 
    document.getElementById("requestForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("requestMsg");
      const btn = document.getElementById("sendBtn");
      const email = document.getElementById("resetEmail").value.trim();

      if (!/^\S+@\S+\.\S+$/.test(email)) {
        setMsg(msg, "err", "Enter a valid email address.");
        return;
      }
      btn.disabled = true;
      btn.textContent = "Sending...";
      try {
        await fetch(API_BASE + "/api/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        setMsg(msg, "ok", "If that email is registered, a reset link is on its way. It expires in 15 minutes.");
      } catch {
        setMsg(msg, "err", "Couldn't reach the server. Try again.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Send reset link";
      }
    });

    //saving the password
    document.getElementById("newPassForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("newPassMsg");
      const btn = document.getElementById("resetBtn");
      const password = document.getElementById("newPassword").value;
      const confirm = document.getElementById("confirmPassword").value;

      if (password.length < 8) { setMsg(msg, "err", "Password must be at least 8 characters."); return; }
      if (password !== confirm) { setMsg(msg, "err", "Passwords don't match."); return; }

      btn.disabled = true;
      btn.textContent = "Saving...";
      try {
        const res = await fetch(API_BASE + "/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          show("doneView");
        } else {
          setMsg(msg, "err", (data.error || "Something went wrong.") +
            ' <a href="reset-password.html">Request a new link</a>');
        }
      } catch {
        setMsg(msg, "err", "Couldn't reach the server. Try again.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Reset password";
      }
    });
  </script>
</body>
</html>
