<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - eCamp</title>
</head>
<body>
  <h2>Reset your password</h2>

  <!-- Shown when there is no token: ask for email -->
  <div id="requestBox">
    <input type="email" id="resetEmail" placeholder="user@my.hamptonu.edu">
    <button id="sendBtn">Send reset link</button>
  </div>

  <!-- Shown when opened from the email link: ask for new password -->
  <div id="newPassBox" style="display:none;">
    <input type="password" id="newPassword" placeholder="New password (8+ characters)">
    <button id="resetBtn">Reset password</button>
  </div>

  <p id="msg"></p>
  <a href="Signin.html">Back to sign in</a>

  <script>
    const API_BASE = window.location.origin;
    const token = new URLSearchParams(window.location.search).get("token");
    const msg = document.getElementById("msg");

    if (token) {
      document.getElementById("requestBox").style.display = "none";
      document.getElementById("newPassBox").style.display = "block";
    }

    document.getElementById("sendBtn").addEventListener("click", async () => {
      const email = document.getElementById("resetEmail").value.trim();
      if (!email) { msg.textContent = "Enter your email."; return; }
      await fetch(API_BASE + "/api/auth/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });
      msg.textContent = "If that email is registered, a reset link has been sent.";
    });

    document.getElementById("resetBtn").addEventListener("click", async () => {
      const password = document.getElementById("newPassword").value;
      const res = await fetch(API_BASE + "/api/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, password })
      });
      const data = await res.json();
      msg.textContent = res.ok ? "Password updated. You can sign in now." : (data.error || "Something went wrong.");
    });
  </script>
</body>
</html>
