name: Deploy to Elastic Beanstalk

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-cloudmart-env
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      EB_APPLICATION_NAME: Ecamp
      EB_ENVIRONMENT_NAME: cloudmart-env
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Elastic Beanstalk CLI
        run: python -m pip install --upgrade awsebcli

      - name: Initialize Elastic Beanstalk CLI
        run: |
          eb init "$EB_APPLICATION_NAME" \
            --platform "Python 3.11 running on 64bit Amazon Linux 2023" \
            --region "$AWS_REGION"

      - name: Deploy
        run: eb deploy "$EB_ENVIRONMENT_NAME" --timeout 15
